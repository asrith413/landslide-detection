[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landslide-detection"
version = "0.1.0"
description = "RGB-only structure-aware landslide segmentation and local Tauri application"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "asrith413", email = "asrith413@gmail.com"}]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.0",
  "h5py>=3.9",
  "scipy>=1.10",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
colab = [
  "matplotlib>=3.8,<4",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "onnxscript>=0.5,<1",
  "tqdm>=4.66,<5",
  "transformers>=4.46,<5",
]

[tool.setuptools.packages.find]
where = ["ml"]
include = ["landslide*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
